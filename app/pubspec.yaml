name: stamp_rally
description: Offline-first Flutter app for collecting digital convention stamps.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  hive_flutter: ^1.1.0
  mobile_scanner: ^6.0.7
  qr_flutter: ^4.1.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
